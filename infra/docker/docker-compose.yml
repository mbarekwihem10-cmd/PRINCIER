services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner
      POSTGRES_DB: tripplanner
    ports:
      - "5432:5432"
    volumes:
      - tripplanner_postgres_data:/var/lib/postgresql/data
      - ./postgres/init-uuidv7.sql:/docker-entrypoint-initdb.d/init-uuidv7.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripplanner -d tripplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tripplanner_postgres_data:
